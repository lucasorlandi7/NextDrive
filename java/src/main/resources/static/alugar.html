<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Next Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div id="topo"></div>

    <div class="container pb-5" style="max-width: 600px;">
        <div id="mensagem" class="alert d-none" role="alert"></div>

        <div class="card">
            <div class="card-body">
                <h5>Alugar um carro</h5>
                <label class="form-label mt-2">Carro</label>
                <select id="alugar-carro" class="form-select"></select>
                <label class="form-label mt-2">Cliente</label>
                <select id="alugar-cliente" class="form-select"></select>
                <label class="form-label mt-2">Data de retirada</label>
                <input id="alugar-retirada" type="date" class="form-control">
                <label class="form-label mt-2">Data de devolução</label>
                <input id="alugar-devolucao" type="date" class="form-control">
                <button class="btn btn-primary mt-3" id="alugar-confirmar">Alugar</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
    <script>
        verificarLogin();
        montarMenu('alugar.html');

        function carregarListas() {
            $.get('/veiculos', function (lista) {
                $('#alugar-carro').empty().append($('<option value="">Escolha o carro...</option>'));
                lista.forEach(function (v) {
                    if (v.status === 'DISPONIVEL') {
                        $('#alugar-carro').append($('<option>').val(v.id)
                            .text(v.placa + ' - ' + v.modelo + ' (' + dinheiro(v.categoria.valorDiaria) + ' por dia)'));
                    }
                });
            });
            $.get('/clientes', function (lista) {
                $('#alugar-cliente').empty().append($('<option value="">Escolha o cliente...</option>'));
                lista.forEach(function (c) {
                    $('#alugar-cliente').append($('<option>').val(c.id).text(c.nome));
                });
            });
        }

        $('#alugar-retirada').val(hoje());

        $('#alugar-confirmar').click(function () {
            var dados = {
                clienteId: $('#alugar-cliente').val(),
                veiculoId: $('#alugar-carro').val(),
                dataRetirada: $('#alugar-retirada').val(),
                dataDevolucao: $('#alugar-devolucao').val()
            };
            enviar('POST', '/locacoes', dados, function () {
                $('#alugar-devolucao').val('');
                carregarListas();
            });
        });

        carregarListas();
    </script>
</body>

</html>
