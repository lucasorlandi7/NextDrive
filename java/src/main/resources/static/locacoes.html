<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Next Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div id="topo"></div>

    <div class="container pb-5">
        <div id="mensagem" class="alert d-none" role="alert"></div>

        <div class="card mb-4">
            <div class="card-body">
                <h5>Locações</h5>
                <table class="table table-striped mb-0">
                    <thead><tr><th>Cliente</th><th>Carro</th><th>Retirada</th><th>Devolução</th><th>Valor final</th><th>Pagamento</th><th>Situação</th><th></th></tr></thead>
                    <tbody id="tabela-locacoes"></tbody>
                </table>
            </div>
        </div>

        <div class="card border-primary d-none" id="cartao-devolver">
            <div class="card-body">
                <h5>Devolver e pagar: <span id="devolver-locacao"></span></h5>
                <input type="hidden" id="devolver-id">
                <div class="row g-2">
                    <div class="col-md-2"><input id="devolver-km" type="number" class="form-control" placeholder="Km na devolução"></div>
                    <div class="col-md-2"><input id="devolver-data" type="date" class="form-control" title="Data da devolução"></div>
                    <div class="col-md-2">
                        <select id="devolver-forma" class="form-select">
                            <option value="CARTAO">Cartão</option>
                            <option value="PIX">Pix</option>
                        </select>
                    </div>
                    <div class="col-md-3"><input id="devolver-detalhe" class="form-control" placeholder="Bandeira ou txid"></div>
                    <div class="col-md-3">
                        <button class="btn btn-primary" id="devolver-confirmar">Devolver e pagar</button>
                        <button class="btn btn-secondary" id="devolver-cancelar">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
    <script>
        verificarLogin();
        montarMenu('locacoes.html');

        function carregarLocacoes() {
            $.get('/locacoes', function (lista) {
                $('#tabela-locacoes').empty();
                lista.forEach(function (item) {
                    var l = item.locacao;
                    var acoes = $('<span>');
                    if (l.status === 'ABERTA') {
                        acoes.append(botao('Devolver e pagar', 'btn-primary', function () { abrirDevolucao(l); }));
                    }
                    $('#tabela-locacoes').append(linha([l.reserva.cliente.nome, l.veiculo.placa + ' ' + l.veiculo.modelo,
                        l.dataRetirada, l.dataDevolucaoReal || 'em aberto',
                        l.valorFinal === null ? '-' : dinheiro(l.valorFinal), item.pagamento, l.status, acoes]));
                });
            });
        }

        function abrirDevolucao(l) {
            $('#devolver-id').val(l.id);
            $('#devolver-locacao').text(l.reserva.cliente.nome + ' - ' + l.veiculo.placa);
            $('#devolver-km').val('');
            $('#devolver-data').val(hoje());
            $('#devolver-detalhe').val('');
            $('#cartao-devolver').removeClass('d-none')[0].scrollIntoView();
        }

        $('#devolver-cancelar').click(function () {
            $('#cartao-devolver').addClass('d-none');
        });

        $('#devolver-confirmar').click(function () {
            var dados = {
                quilometragem: $('#devolver-km').val(),
                dataDevolucao: $('#devolver-data').val(),
                forma: $('#devolver-forma').val(),
                detalhe: $('#devolver-detalhe').val()
            };
            enviar('PUT', '/locacoes/' + $('#devolver-id').val() + '/devolucao', dados, function () {
                $('#cartao-devolver').addClass('d-none');
                carregarLocacoes();
            });
        });

        carregarLocacoes();
    </script>
</body>

</html>
