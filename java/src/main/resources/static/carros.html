<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Next Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div id="topo"></div>

    <div class="container pb-5">
        <div id="mensagem" class="alert d-none" role="alert"></div>

        <div class="card mb-4">
            <div class="card-body">
                <h5>Cadastrar carro</h5>
                <div class="row g-2">
                    <div class="col-md-3"><select id="carro-categoria" class="form-select"></select></div>
                    <div class="col-md-2"><input id="carro-placa" class="form-control" placeholder="Placa" maxlength="8"></div>
                    <div class="col-md-3"><input id="carro-modelo" class="form-control" placeholder="Modelo"></div>
                    <div class="col-md-1"><input id="carro-ano" type="number" class="form-control" placeholder="Ano"></div>
                    <div class="col-md-1"><input id="carro-km" type="number" class="form-control" placeholder="Km"></div>
                    <div class="col-md-2"><button class="btn btn-primary" id="carro-salvar">Cadastrar carro</button></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5>Carros</h5>
                <table class="table table-striped mb-0">
                    <thead><tr><th>Placa</th><th>Modelo</th><th>Categoria</th><th>Diária</th><th>Situação</th><th></th></tr></thead>
                    <tbody id="tabela-carros"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
    <script>
        verificarLogin();
        montarMenu('carros.html');

        function carregarCategorias() {
            $.get('/categorias', function (lista) {
                $('#carro-categoria').empty();
                lista.forEach(function (c) {
                    $('#carro-categoria').append($('<option>').val(c.id).text(c.nome));
                });
            });
        }

        function carregarCarros() {
            $.get('/veiculos', function (lista) {
                $('#tabela-carros').empty();
                lista.forEach(function (v) {
                    var acoes = $('<span>');
                    if (v.status === 'DISPONIVEL') {
                        acoes.append(botao('Manutenção', 'btn-outline-warning', function () {
                            enviar('PUT', '/veiculos/' + v.id + '/situacao', { situacao: 'MANUTENCAO' }, carregarCarros);
                        }));
                    } else if (v.status === 'MANUTENCAO') {
                        acoes.append(botao('Liberar', 'btn-outline-success', function () {
                            enviar('PUT', '/veiculos/' + v.id + '/situacao', { situacao: 'DISPONIVEL' }, carregarCarros);
                        }));
                    }
                    acoes.append(botao('Excluir', 'btn-outline-danger', function () {
                        if (confirm('Excluir o carro ' + v.placa + '?')) {
                            enviar('DELETE', '/veiculos/' + v.id, null, carregarCarros);
                        }
                    }));
                    $('#tabela-carros').append(linha([v.placa, v.modelo + ' (' + v.ano + ')', v.categoria.nome,
                        dinheiro(v.categoria.valorDiaria), v.status, acoes]));
                });
            });
        }

        $('#carro-salvar').click(function () {
            var dados = {
                categoriaId: $('#carro-categoria').val(),
                placa: $('#carro-placa').val(),
                modelo: $('#carro-modelo').val(),
                ano: $('#carro-ano').val(),
                quilometragem: $('#carro-km').val()
            };
            enviar('POST', '/veiculos', dados, function () {
                $('#carro-placa, #carro-modelo, #carro-ano, #carro-km').val('');
                carregarCarros();
            });
        });

        carregarCategorias();
        carregarCarros();
    </script>
</body>

</html>
