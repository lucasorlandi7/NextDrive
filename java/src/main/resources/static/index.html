<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Next Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container" style="max-width: 400px; margin-top: 12vh;">
        <div class="card">
            <div class="card-body">
                <h4 class="text-center mb-3">Next Drive</h4>
                <p class="text-center text-muted">Locadora de Veículos</p>
                <div id="mensagem" class="alert alert-danger d-none" role="alert"></div>
                <input id="usuario" class="form-control mb-2" placeholder="Usuário">
                <input id="senha" type="password" class="form-control mb-3" placeholder="Senha">
                <button class="btn btn-primary w-100" id="entrar">Entrar</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
    <script>
        sessionStorage.removeItem('logado');

        function entrar() {
            if ($('#usuario').val() === 'admin' && $('#senha').val() === '1234') {
                sessionStorage.setItem('logado', 'sim');
                window.location.href = 'menu.html';
            } else {
                mostrar('Usuário ou senha incorretos.', 'danger');
            }
        }

        $('#entrar').click(entrar);
        $('#senha').keypress(function (e) {
            if (e.which === 13) {
                entrar();
            }
        });
    </script>
</body>

</html>
